// 随机空袭 v1.0.1；每行一个配置项，修改后下一回合生效。
// 此文件按数据解析，支持数字、true/false、模式或地图名称数组及 // 注释。
{
    allowed_gamemodes = ["coop", "realism"]
    disallowed_maps = ["c1m1_hotel", "c1m3_mall", "c1m4_atrium", "c5m4_quarter", "c8m2_subway", "c8m4_interior", "c10m2_drainage", "c11m4_terminal", "c12m5_cornfield"]
    one_in_what_chance = 20          // 每次抽签概率 1/N，范围 1~100000
    flow_percent_dist_variance = 5  // 与领先生还者的路线进度差，范围 0~100 个百分点
    air_strike_delay = 75           // 成功生成飞机后的冷却，范围 5~3600 秒
    drop_bomb = 1                   // 0=仅飞机飞越，1=开启爆炸
    summon_horde = 0                // 1=爆炸后重置导演的尸潮计时，具体刷怪由导演控制
    explode_radius = 500            // 爆炸和踉跄半径，范围 1~4096 游戏单位
    explode_dmg = 200               // 爆炸强度，范围 0~10000；保留对生还者的伤害
    initial_delay = 40              // 首人离开安全区后的等待，范围 0~3600 秒
    check_interval = 1.0            // 两次抽签至少间隔，范围 0.1~60 秒
    max_position_attempts = 16      // 每次空袭最多尝试的导航区域数，范围 1~64
    max_strike_distance = 1500      // 落点距领先生还者的最大直线距离，范围 128~8192
    plane_height = 2048             // 飞机相对落点高度，范围 256~4096；另需 128 单位净空
}
