// Mutation4 Director HUD 0.3.2
// 路径相对于 left4dead2/。修改后服务器控制台执行：
// exec sourcemod/my_mutation4_diag.cfg

// 自动日志：1 开，0 关；不影响 HUD。按服务器日期追加 JSONL，不自动删除。
// 管理员手动 sm_m4diag_snapshot 不受本开关限制。
sm_m4diag_enable "1"
// 日志间隔，游戏秒，最小 0.1。
sm_m4diag_interval "1.0"
// 校验后读取导演内部字段：1 开，0 仅基础数据。
// Windows/Linux x86；不支持的版本自动显示未知，不猜测内存偏移。
sm_m4diag_internal "1"

// 全服共享 HUD：1 开，0 关。与日志开关独立。
// 普通玩家 sm_dhud / !dhud 可切换此状态；下次执行本配置会恢复这里的设定。
sm_m4hud_enable "1"
// HUD 刷新间隔，游戏秒，最小 0.2，默认 1。
sm_m4hud_interval "1.0"
// EMS 共 15 个共享栏位。本插件需要 6 个空闲栏位。
// auto 自动寻找；或填 6 个不重复栏位，例 "0,5,6,7,8,9"（仅示例，并非保证空闲）。
// 已有内容的栏位不会被强占。被其他插件覆盖后让出，15 秒后重试。
// 若 lyt 排行榜/击杀列表或地图脚本已占满，需要先在对应插件关闭部分 HUD。
sm_m4hud_slots "auto"
// 玩家统计区的位置和尺寸；左上状态栏、右上时间栏固定在顶部。
// 不同插件即使栏位不同仍可能在画面上重叠，可移动此面板。
sm_m4hud_x "0.00"
sm_m4hud_y "0.085"
sm_m4hud_width "0.60"
// 统计区文字行高估算，默认沿用 lyt 的 0.021。范围 0.018..0.040。
// 栏位高度另按至少 0.030/行加 0.012 余量计算，不能拿文字行高当画板高度。
// 标题与拆分名单保持相同画板、行数和空行占位。超出屏幕时调整位置。
sm_m4hud_row "0.021"
// 强度每页 9 人，不限制总人数；超出则轮页。每页游戏秒，最小 2。
sm_m4hud_page_seconds "5.0"
