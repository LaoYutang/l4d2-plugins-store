// ConVars for plugin "l4d2_vscript_purifier_v2.smx"

// 是否阻止非法脚本造成脚本污染。0=不阻止, 1=阻止。
// 注意：地图脚本必须和地图 mission 文件放在同一个 VPK 内才会被识别，否则会被视为脚本类 Mod。
// -
// Default: "1"
// Minimum: "0.000000"
// Maximum: "1.000000"
l4d2_vscript_purifier_v2 "1"

// 脚本修改 ConVar 的处理方式。0=不处理, 1=过关或回合开始时恢复默认值, 2=直接拦截脚本修改请求。
// -
// Default: "1"
// Minimum: "0.000000"
// Maximum: "2.000000"
l4d2_vscript_cvarRestore_v2 "1"

