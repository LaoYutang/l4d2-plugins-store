// ConVars for plugin "l4d_survivor_shove.smx"
// Survivor Shove 1.17 - L4D2 商店预设


// 插件总开关。0=关闭，1=开启。
// -
// Default: "1"
l4d_survivor_shove_allow "1"

// 真人与 Bot 的推击过滤。
// 0=全部允许，1=只能推 Bot，2=只能推真人，4=Bot 不能推真人；数值可相加。
// 6=只有真人能推真人，3 和 7 都会阻止全部目标。
// -
// Default: "0"
l4d_survivor_shove_bots "0"

// 每名推人者成功推人后的额外冷却时间，单位为秒。0=无额外冷却。
// -
// Default: "0"
// Minimum: "0.000000"
l4d_survivor_shove_delay "0"

// 允许使用推人功能的 SourceMod 权限字符。
// 多个字符按“拥有任意一个即可”判断；空字符串=所有玩家。
// 上游默认值为 "z"，本包预设为空以允许所有玩家。
// -
// Default: "z"
l4d_survivor_shove_flags ""

// 被推免疫的 SourceMod 权限字符。
// 多个字符按“拥有任意一个即可”判断；空字符串=无人免疫。
// -
// Default: ""
l4d_survivor_shove_immune ""

// 推人按键。1=普通右键推击，2=必须同时按住使用键 E 再右键推击。
// -
// Default: "1"
l4d_survivor_shove_keys "1"

// 玩家加入服务器时的个人推人能力初始状态。0=关闭，1=开启。
// -
// Default: "1"
l4d_survivor_shove_start "1"

// 被成功推击后发出叫声的概率。0=关闭，1-100=百分比。
// -
// Default: "50"
l4d_survivor_shove_vocalize "100"

// 叫声类型。0=死亡惨叫，1=受伤语音。
// -
// Default: "1"
l4d_survivor_shove_vocal_type "1"

// 精确游戏模式白名单，使用 mp_gamemode 名称，逗号分隔且不要加入空格。
// 空字符串=不限制。例如："coop,realism"。
// -
// Default: ""
l4d_survivor_shove_modes ""

// 精确游戏模式黑名单，使用 mp_gamemode 名称，逗号分隔且不要加入空格。
// 空字符串=不排除。例如："versus,scavenge"。
// -
// Default: ""
l4d_survivor_shove_modes_off ""

// 按游戏模式大类启用插件。
// 0=全部，1=合作，2=生还者，4=对抗，8=清道夫；数值可相加。
// -
// Default: "0"
l4d_survivor_shove_modes_tog "0"
