// ConVars for plugin "l4d2_infiniteammo.smx"

// 无限功能总开关：0=关闭，1=按玩家开启，2=所有玩家自动开启。
// -
// Default: "2"
// Minimum: "0.000000"
// Maximum: "2.000000"
l4d2_iammo_enable "2"

