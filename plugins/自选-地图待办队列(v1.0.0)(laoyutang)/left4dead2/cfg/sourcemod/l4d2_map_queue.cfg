// ConVars for plugin "l4d2_map_queue.smx"


// 是否启用地图待办队列。
// -
// Default: "1"
// Minimum: "0.000000"
// Maximum: "1.000000"
l4d2_map_queue_enable "1"

// 战役通关后，自动进入下一个待办前等待的秒数。
// -
// Default: "3.0"
// Minimum: "0.000000"
// Maximum: "60.000000"
l4d2_map_queue_change_delay "3.0"

// 普通玩家发起地图待办投票时的持续秒数。
// -
// Default: "20"
// Minimum: "5.000000"
// Maximum: "60.000000"
l4d2_map_queue_vote_time "20"
