// ConVars for plugin "l4d2_sb_fix.smx"


// 是否启用插件 <0: 禁用, 1: 启用>
// -
// Default: "1"
// Minimum: "0.000000"
// Maximum: "1.000000"
sb_fix_enabled "1"

// 哪些生还者机器人需要加强 <0: 全部的机器人, 1: 离开安全区时随机选择’sb_fix_select_number‘值设定的机器人数量, 2: 在 ‘sb_fix_select_character_name ’中输入要改进的生还者机器人的角色名称>
// -
// Default: "0"
// Minimum: "0.000000"
// Maximum: "2.000000"
sb_fix_select_type "0"

// 如果‘sb_fix_select_type’为1，请输入生还者机器人的数量。<0 ~ 4>
// -
// Default: "1"
// Minimum: "0.000000"
sb_fix_select_number "1"

// 如果 ’sb_fix_select_type'的值是4，输入要改进的生还者机器人的名称。用空格隔开。例如：nick francis bill
// -
// Default: ""
sb_fix_select_character_name ""

// 生还者机器人在主武器没有弹药之前，是否不允许切换到副武器 <0:否, 1:是>
// -
// Default: "1"
// Minimum: "0.000000"
// Maximum: "1.000000"
sb_fix_dont_switch_secondary "1"

// 生还者机器人是否救助倒地的生还者 <0: 否, 1: 是>
// -
// Default: "1"
// Minimum: "0.000000"
// Maximum: "1.000000"
sb_fix_help_enabled "1"

// 生还者机器人救助倒地/被控生还者的范围
// -
// Default: "1200"
// Minimum: "1.000000"
// Maximum: "3000.000000"
sb_fix_help_range "1200"

// 是否允许生还者机器人使用推动感染者进行帮助 <0: 不用推动帮助, 1: 只推Smoker进行帮助, 2: 推Smoker和Jockey进行帮助, 3: 推Smoker、Jockey和Hunter进行帮助 | def: 2>
// -
// Default: "3"
// Minimum: "0.000000"
// Maximum: "3.000000"
sb_fix_help_shove_type "3"

// 如果 ’sb_fix_help_shove_type‘的值为2或更多，则生还者机器人只在换弹时进行推动帮助 <0: 禁用, 1: 启用>
// -
// Default: "0"
// Minimum: "0.000000"
// Maximum: "1.000000"
sb_fix_help_shove_reloading "0"

// 生还者机器人是否处理普通感染者 <0: 否, 1: 是>
// -
// Default: "1"
// Minimum: "0.000000"
// Maximum: "1.000000"
sb_fix_ci_enabled "1"

// 生还者机器人处理普通感染者的范围
// -
// Default: "500"
// Minimum: "1.000000"
// Maximum: "2000.000000"
sb_fix_ci_range "500"

// 生还者机器人是否使用近战处理普通感染者 <0: 否 1: 是>
// -
// Default: "1"
// Minimum: "0.000000"
// Maximum: "1.000000"
sb_fix_ci_melee_allow "1"

// 如果启用了’sb_fix_ci_melee_allow‘ 则生还者机器人使用近战武器清理普通感染者的范围是多少
// -
// Default: "150"
// Minimum: "1.000000"
// Maximum: "500.000000"
sb_fix_ci_melee_range "150"

// 生还者机器人是否处理特殊感染者 <0: 否, 1: 是>
// -
// Default: "1"
// Minimum: "0.000000"
// Maximum: "1.000000"
sb_fix_si_enabled "1"

// 生还者机器人射击、搜索特殊感染者的范围
// -
// Default: "500"
// Minimum: "1.000000"
// Maximum: "3000.000000"
sb_fix_si_range "500"

// 生还者机器人是否忽略并推开其他生还者附近的Boomer <0: 否, 1: 是>
// -
// Default: "1"
// Minimum: "0.000000"
// Maximum: "1.000000"
sb_fix_si_ignore_boomer "1"

// 生还者机器人忽略Boomer的范围
// -
// Default: "200"
// Minimum: "1.000000"
// Maximum: "500.000000"
sb_fix_si_ignore_boomer_range "200"

// 生还者机器人是否处理Tank. <0: 否, 1: 是>
// -
// Default: "1"
// Minimum: "0.000000"
// Maximum: "1.000000"
sb_fix_tank_enabled "1"

// 生还者机器人射击、搜索Tank的范围
// -
// Default: "1200"
// Minimum: "1.000000"
// Maximum: "3000.000000"
sb_fix_tank_range "1200"

// 当一个特殊感染者和一个Tank克同时出现在指定范围内时，生还者机器人优先处理哪个 <0: 最近的, 1: 特殊感染者, 2: Tank>。
// -
// Default: "0"
// Minimum: "0.000000"
// Maximum: "2.000000"
sb_fix_si_tank_priority_type "0"

// 生还者机器人是否推动飞行中的Hunter或者Jockey <0: 否, 1: 是>
// -
// Default: "1"
// Minimum: "0.000000"
// Maximum: "1.000000"
sb_fix_bash_enabled "1"

// 生还者机器人成功推开飞行中Hunter的几率(即使设定为100也不确定一定能推动)
// -
// Default: "100"
// Minimum: "0.000000"
// Maximum: "100.000000"
sb_fix_bash_hunter_chance "100"

// 生还者机器人射击、搜索飞行中的Hunter范围
// -
// Default: "100"
// Minimum: "1.000000"
// Maximum: "500.000000"
sb_fix_bash_hunter_range "100"

// 生还者机器人成功推开飞行中Jockey的几率(即使设定为100也不确定一定能推动)
// -
// Default: "100"
// Minimum: "0.000000"
// Maximum: "100.000000"
sb_fix_bash_jockey_chance "100"

// 生还者机器人射击、搜索飞行中的Jockey范围
// -
// Default: "100"
// Minimum: "1.000000"
// Maximum: "500.000000"
sb_fix_bash_jockey_range "100"

// 生还者机器人是否射击Tank扔出的石头 <0: 否, 1: 是>
// -
// Default: "1"
// Minimum: "0.000000"
// Maximum: "1.000000"
sb_fix_rock_enabled "1"

// 生还者机器人射击、搜索Tank扔出的石头范围
// -
// Default: "700"
// Minimum: "1.000000"
// Maximum: "2000.000000"
sb_fix_rock_range "700"

// 是否使生还者机器人射击愤怒的Witch <0: 否, 1: 是>
// -
// Default: "1"
// Minimum: "0.000000"
// Maximum: "1.000000"
sb_fix_witch_enabled "1"

// 生还者机器人射击、搜索愤怒的Witch范围
// -
// Default: "1500"
// Minimum: "1.000000"
// Maximum: "2000.000000"
sb_fix_witch_range "1500"

// 生还者机器人射击、搜索使生还者倒地的Witch范围
// -
// Default: "1000"
// Minimum: "0.000000"
// Maximum: "2000.000000"
sb_fix_witch_range_incapacitated "1000"

// 生还者机器人射击、搜索击杀生还者的Witch范围
// -
// Default: "0"
// Minimum: "0.000000"
// Maximum: "2000.000000"
sb_fix_witch_range_killed "0"

// 如果如果有猎枪，控制攻击时机持有霰弹枪，是否控制攻击时机 <0: 否, 1: 是>
// -
// Default: "1"
// Minimum: "0.000000"
// Maximum: "1.000000"
sb_fix_witch_shotgun_control "1"

// 如果Witch在生还者机器人设定的范围内，则生还者机器人停止攻击
// -
// Default: "300"
// Minimum: "1.000000"
// Maximum: "1000.000000"
sb_fix_witch_shotgun_range_max "300"

// 如果Witch不在生还者机器人设定的范围或更远，则生还者机器人停止攻击。
// -
// Default: "70"
// Minimum: "1.000000"
// Maximum: "500.000000"
sb_fix_witch_shotgun_range_min "70"

// 是否使生还者机器人优先处理试图自杀的Smoker <0: 否, 1: 是>
// -
// Default: "1"
// Minimum: "0.000000"
// Maximum: "1.000000"
sb_fix_prioritize_ownersmoker "1"

// 是否启用倒地者指令 <0: 否, 1: 是>
// -
// Default: "1"
// Minimum: "0.000000"
// Maximum: "1.000000"
sb_fix_incapacitated_enabled "1"

// 是否启用调试信息输出 <0:禁用, 1:启用>
// -
// Default: "0"
// Minimum: "0.000000"
// Maximum: "1.000000"
sb_fix_debug "0"