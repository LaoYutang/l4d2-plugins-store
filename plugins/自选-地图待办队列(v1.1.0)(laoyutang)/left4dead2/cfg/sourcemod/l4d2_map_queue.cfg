// ConVars for plugin "l4d2_map_queue.smx"


// 是否启用地图待办队列。
// -
// Default: "1"
// Minimum: "0.000000"
// Maximum: "1.000000"
l4d2_map_queue_enable "1"

// 收到战役终局事件后，进入下一个待办前等待的秒数。
// 保留原有延迟；缺少终局事件时，统计消息兜底在下一帧切图。
// -
// Default: "3.0"
// Minimum: "0.000000"
// Maximum: "60.000000"
l4d2_map_queue_change_delay "3.0"

// 章节换图后等待真人重连的缓冲秒数，按实际时间计算。
// 已连接但仍在加载的玩家不会被判为空服。
// -
// Default: "30.0"
// Minimum: "1.000000"
// Maximum: "120.000000"
l4d2_map_queue_reconnect_grace "30.0"

// 普通玩家发起地图待办投票时的持续秒数。
// -
// Default: "20"
// Minimum: "5.000000"
// Maximum: "60.000000"
l4d2_map_queue_vote_time "20"
