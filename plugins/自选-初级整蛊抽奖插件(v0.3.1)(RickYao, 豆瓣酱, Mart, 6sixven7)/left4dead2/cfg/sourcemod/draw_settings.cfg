// 双奖池0.3.0：开关、限制、次数发放、效果参数。
// 优先名单请编辑 draw_priority_memberlist.cfg。

// 总开关 0=关闭 1=开启
draw_enable "1"

// 优先玩家开关安全门触发开关
draw_door_enable "1"

// 优先玩家引燃/引爆触发开关
draw_explosion_enable "1"

// 开与关合计，严格超过该次数抽奖，抽后计数归零
draw_door_limit "2"

// 每次优先抽奖给每位在线真人增加普通次数
draw_normal_grant_on_priority "1"

// 每章节每位真人初始普通次数，中途首次加入补领一次
draw_normal_grant_on_chapter "3"

// 普通个人冰冻秒数
draw_normal_freeze_duration "15"

// 优先冰冻炸弹造成的冰冻秒数
draw_priority_freeze_duration "15"

// 优先冰冻炸弹引爆倒计时秒数
draw_priority_freeze_bomb_countdown "8"

// 冰冻炸弹半径
draw_priority_freeze_bomb_radius "400"

// 定时炸弹倒计时秒数
draw_priority_time_bomb_countdown "8"

// 定时炸弹半径
draw_priority_time_bomb_radius "200"

// 定时炸弹中心伤害，距离越远越低
draw_priority_time_bomb_damage "200"

// 个人中毒持续秒数
draw_priority_drug_duration "30"

// 个人低重力倍率
draw_priority_moon_gravity "0.1"

// 个人低重力秒数
draw_priority_moon_duration "180"

// 个人高重力倍率，死亡或回合结束解除
draw_priority_heavy_gravity "3"

// 加血最小值
draw_priority_heal_min "1"

// 加血最大值
draw_priority_heal_max "99"

// 扣血最小值
draw_priority_hurt_min "1"

// 扣血最大值
draw_priority_hurt_max "99"

// 同一玩家同一物品类型触发间隔秒数，0=关闭
draw_explosion_cooldown "0.1"

// 每条优先结果屏幕提示显示间隔秒数
draw_hud_seconds "0.1"

// 引燃汽油桶提示与触发开关：0关闭，1开启
draw_trigger_gascan "1"

// 打爆白色大油桶提示与触发开关：0关闭，1开启
draw_trigger_fuelbarrel "1"

// 打爆煤气罐提示与触发开关：0关闭，1开启
draw_trigger_propane "1"

// 打爆氧气瓶提示与触发开关：0关闭，1开启
draw_trigger_oxygen "1"

// 引燃路障油桶提示与触发开关：0关闭，1开启
draw_trigger_barricade "1"

// 打爆汽油泵提示与触发开关：0关闭，1开启
draw_trigger_gaspump "1"

// 点燃烟花盒提示与触发开关：0关闭，1开启
draw_trigger_fireworks "1"

// 打爆爆炸大油桶提示与触发开关：0关闭，1开启
draw_trigger_oildrum "1"

